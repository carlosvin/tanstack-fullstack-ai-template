id: observability-and-env
title: Observability and Environment Setup
summary: >-
  Use when adding structured logging (pino), centralized environment validation
  (Zod), or Sentry initialization to a TanStack Start app. Teaches the
  three-file bootstrap pattern (instrument.env.mts → instrument.shared.mts →
  instrument.server.mts; emitted as .mjs for production), the src/env/ schema
  split (server vs public), and the
  createModuleLogger / createServerLogger factory pattern that eliminates
  scattered process.env access from application code.
