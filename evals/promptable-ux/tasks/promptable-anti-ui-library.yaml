id: promptable-anti-ui-library
name: Do not use for UI library lookup
description: Covers DO NOT USE FOR which UI library (use reference-tech-stack).
tags: [ux, anti-trigger]
inputs:
  prompt: Which UI library (use reference-tech-stack) does this template use?
expected:
  outcomes:
    - type: task_completed
graders:
  - name: has_output
    type: code
    config:
      assertions:
        - "len(output) > 10"
