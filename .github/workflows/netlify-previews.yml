name: Netlify previews

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

# NETLIFY_AUTH_TOKEN (Netlify personal access token) is required.
# Production publishes stay on Netlify Git (push to main). This workflow only
# records one GitHub status per site and deletes deploy previews after close.

jobs:
  report:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: netlify-preview-status-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Record a preview status for each site
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/netlify/report-preview-statuses.mjs

  cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Delete deploy previews for the closed pull request
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/netlify/delete-deploy-previews.mjs
