id: agentic-anti-architecture
name: Do not use for schema or server boundaries
description: >-
  Covers DO NOT USE FOR schema layers or server boundaries (use
  tanstack-promptable-fullstack-app-template).
tags: [ux, anti-trigger]
inputs:
  prompt: >-
    Explain schema layers or server boundaries (use
    tanstack-promptable-fullstack-app-template) rather than the agentic shell.
expected:
  outcomes:
    - type: task_completed
graders:
  - name: has_output
    type: code
    config:
      assertions:
        - "len(output) > 10"
