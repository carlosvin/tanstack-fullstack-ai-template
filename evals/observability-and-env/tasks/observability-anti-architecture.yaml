id: observability-anti-architecture
name: Do not use for new entities
description: Covers DO NOT USE FOR new entities, routes, or repository methods (use tanstack-promptable-fullstack-app-template).
tags: [observability, anti-trigger]
inputs:
  prompt: >-
    Add new entities or routes (use tanstack-promptable-fullstack-app-template)
    rather than observability-and-env.
expected:
  outcomes:
    - type: task_completed
graders:
  - name: has_output
    type: code
    config:
      assertions:
        - "len(output) > 10"
