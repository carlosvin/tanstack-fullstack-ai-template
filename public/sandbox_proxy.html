<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Sandbox Proxy</title>
		<style>
			html,
			body {
				margin: 0;
				width: 100%;
				height: 100%;
			}
			body {
				display: flex;
			}
			iframe {
				flex: 1;
				width: 100%;
				height: 100%;
				border: 0;
				background: transparent;
			}
		</style>
	</head>
	<body>
		<iframe id="mcp-view" title="Task view" sandbox="allow-scripts allow-forms"></iframe>
		<script type="module" src="/sandbox_proxy.js"></script>
	</body>
</html>
