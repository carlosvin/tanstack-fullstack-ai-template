id: ux-anti-architecture
name: Do not use for architecture invariants
description: Covers DO NOT USE FOR schema layers or server boundaries (use tanstack-promptable-fullstack-app-template).
tags: [ux, anti-trigger]
inputs:
  prompt: >-
    Explain schema layers or server boundaries (use
    tanstack-promptable-fullstack-app-template) rather than the promptable UX
    skill.
expected:
  outcomes:
    - type: task_completed
graders:
  - name: has_output
    type: code
    config:
      assertions:
        - "len(output) > 10"
