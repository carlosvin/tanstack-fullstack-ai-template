# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/waza/main/schemas/config.schema.json
# Waza config for this template's published Agent Skills.
# Skills live in .agents/skills/; eval suites live in evals/.

paths:
  skills: .agents/skills
  evals: evals
  results: results

defaults:
  engine: mock
  model: mock
  timeout: 60
  parallel: false
  verbose: false

tokens:
  # These are handbook-style architecture skills, not 500-token MCP snippets.
  warningThreshold: 10000
  fallbackLimit: 10000
  limits:
    defaults:
      ".agents/skills/**/SKILL.md": 10000
