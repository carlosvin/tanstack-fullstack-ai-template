<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Task view</title>
		<style>
			:root {
				color-scheme: light dark;
				--text: #1f2937;
				--muted: #6b7280;
				--line: #e5e7eb;
				--card: #ffffff;
				--canvas: transparent;
				--hover: #f8fafc;
			}
			@media (prefers-color-scheme: dark) {
				:root {
					--text: #e5e7eb;
					--muted: #9ca3af;
					--line: #374151;
					--card: #111827;
					--hover: #1f2937;
				}
			}
			body {
				font-family: system-ui, sans-serif;
				margin: 0;
				padding: 12px;
				color: var(--text);
				background: var(--canvas);
			}
			h2 {
				margin: 0 0 10px;
				font-size: 14px;
				font-weight: 600;
				color: var(--muted);
			}
			.list {
				display: flex;
				flex-direction: column;
				gap: 8px;
			}
			.card {
				display: flex;
				flex-direction: column;
				gap: 6px;
				border: 1px solid var(--line);
				border-radius: 10px;
				padding: 12px 14px;
				background: var(--card);
				text-align: left;
			}
			.card[data-prompt] {
				width: 100%;
				font: inherit;
				color: inherit;
				cursor: pointer;
			}
			.card[data-prompt]:hover {
				background: var(--hover);
			}
			.card[data-prompt]:focus-visible {
				outline: 2px solid #0d9488;
				outline-offset: 2px;
			}
			.title {
				display: block;
				font-size: 15px;
				font-weight: 650;
				line-height: 1.3;
			}
			.desc {
				display: block;
				margin: 0;
				color: var(--muted);
				font-size: 13px;
				line-height: 1.4;
			}
			.badges {
				display: flex;
				flex-wrap: wrap;
				gap: 6px;
			}
			.badge {
				font-size: 12px;
				line-height: 1;
				padding: 4px 8px;
				border-radius: 999px;
				background: #f3f4f6;
				color: #374151;
			}
			.status-pending {
				background: #f3f4f6;
				color: #374151;
			}
			.status-progress {
				background: #dbeafe;
				color: #1d4ed8;
			}
			.status-done {
				background: #dcfce7;
				color: #166534;
			}
			.status-cancelled {
				background: #fee2e2;
				color: #991b1b;
			}
			.priority-high,
			.priority-critical {
				background: #ffedd5;
				color: #9a3412;
			}
			.priority-medium {
				background: #eef2ff;
				color: #3730a3;
			}
			.priority-low {
				background: #f3f4f6;
				color: #4b5563;
			}
			.back {
				font: inherit;
				cursor: pointer;
				border: 0;
				background: transparent;
				color: #0f766e;
				padding: 0;
			}
			.empty {
				border: 1px dashed var(--line);
				border-radius: 10px;
				padding: 20px 16px;
			}
			@media (prefers-color-scheme: dark) {
				.badge,
				.status-pending,
				.priority-low {
					background: #374151;
					color: #e5e7eb;
				}
				.status-progress {
					background: #1e3a8a;
					color: #dbeafe;
				}
				.status-done {
					background: #14532d;
					color: #dcfce7;
				}
				.status-cancelled {
					background: #7f1d1d;
					color: #fee2e2;
				}
				.priority-high,
				.priority-critical {
					background: #7c2d12;
					color: #ffedd5;
				}
				.priority-medium {
					background: #312e81;
					color: #e0e7ff;
				}
				.back {
					color: #5eead4;
				}
			}
		</style>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/mcp-task-view.js"></script>
	</body>
</html>
