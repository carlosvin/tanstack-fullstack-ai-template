name: Skills

on:
    pull_request:
    push:
        branches:
            - main

jobs:
    validate-skills:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v5

            - name: Setup pnpm
              uses: pnpm/action-setup@v6
              with:
                  version: 10

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Validate generated skill outputs
              run: pnpm skills:check

            - name: Run skill builder tests
              run: pnpm test:skills

            - name: Run skill evals against example app
              run: pnpm test:skill-evals

            - name: Install Waza
              env:
                  WAZA_VERSION: "0.38.7"
              run: |
                  set -euo pipefail
                  mkdir -p "$HOME/bin"
                  curl -fsSL -o "$HOME/bin/waza" \
                    "https://github.com/microsoft/waza/releases/download/v${WAZA_VERSION}/waza-linux-amd64"
                  chmod +x "$HOME/bin/waza"
                  echo "$HOME/bin" >> "$GITHUB_PATH"
                  "$HOME/bin/waza" --version

            - name: Validate skills with Waza
              env:
                  WAZA_REQUIRED: "1"
              run: pnpm skills:waza

            - name: Upload Waza results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: waza-evaluation-results
                  path: |
                      results/
                      transcripts/
                  if-no-files-found: warn
                  retention-days: 30
