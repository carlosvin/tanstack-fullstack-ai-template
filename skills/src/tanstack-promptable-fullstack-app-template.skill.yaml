id: tanstack-promptable-fullstack-app-template
title: TanStack Promptable Fullstack App Template
summary: >-
  Use when scaffolding a new TanStack Start project, adding domain entities to
  the fullstack template, or implementing the interface-first repository pattern
  with AI-promptable tools, or nested layout routes duplicate beforeLoad checks
  or loaders that should live on a parent route, or TanStack Router, Start, or
  AI behavior must be verified against current documentation instead of training
  data, or route loaders may import databases or secrets, or server-only code may
  leak into the client bundle, or isomorphic loader boundaries are unclear, or
  TanStack Start request context, Register typing, or serverEnv leakage to the
  client must be handled correctly.
