id: observability-structured-logging
name: Add structured logging
description: Covers USE FOR structured logging.
tags: [observability, trigger]
inputs:
  prompt: Add structured logging to a server function without reading process.env in the handler.
expected:
  outcomes:
    - type: task_completed
graders:
  - name: has_output
    type: code
    config:
      assertions:
        - "len(output) > 10"
