<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Task view</title>
		<style>
			:root {
				color-scheme: light dark;
				--text: light-dark(#1f2937, #e5e7eb);
				--muted: light-dark(#4b5563, #9ca3af);
				--line: light-dark(#e5e7eb, #374151);
				--card: light-dark(#ffffff, #111827);
				--hover: light-dark(#f8fafc, #1f2937);
				--canvas: transparent;
				--accent: light-dark(#0f766e, #5eead4);
				--focus: light-dark(#0f766e, #2dd4bf);
				--pending-bg: light-dark(#f3f4f6, #374151);
				--pending-fg: light-dark(#1f2937, #e5e7eb);
				--progress-bg: light-dark(#dbeafe, #1e3a8a);
				--progress-fg: light-dark(#1e3a8a, #dbeafe);
				--done-bg: light-dark(#dcfce7, #14532d);
				--done-fg: light-dark(#14532d, #dcfce7);
				--cancelled-bg: light-dark(#fee2e2, #7f1d1d);
				--cancelled-fg: light-dark(#7f1d1d, #fecaca);
				--high-bg: light-dark(#ffedd5, #7c2d12);
				--high-fg: light-dark(#9a3412, #ffedd5);
				--medium-bg: light-dark(#e0e7ff, #312e81);
				--medium-fg: light-dark(#312e81, #e0e7ff);
			}
			body {
				font-family: system-ui, sans-serif;
				margin: 0;
				padding: 4px 2px 8px;
				color: var(--text);
				background: var(--canvas);
			}
			h2 {
				margin: 0 0 12px;
				font-size: 14px;
				font-weight: 600;
				color: var(--muted);
			}
			.list {
				display: grid;
				grid-template-columns: 1fr;
				gap: 12px;
				margin: 0;
				padding: 0;
				list-style: none;
			}
			@media (min-width: 40rem) {
				.list {
					grid-template-columns: repeat(2, minmax(0, 1fr));
				}
			}
			@media (min-width: 64rem) {
				.list {
					grid-template-columns: repeat(3, minmax(0, 1fr));
				}
			}
			.list > li {
				display: flex;
				min-width: 0;
			}
			.card {
				display: flex;
				flex-direction: column;
				align-items: flex-start;
				gap: 8px;
				box-sizing: border-box;
				width: 100%;
				min-height: 44px;
				border: 1px solid var(--line);
				border-radius: 10px;
				padding: 12px 14px;
				background: var(--card);
				text-align: left;
			}
			.card[data-prompt] {
				font: inherit;
				color: inherit;
				cursor: pointer;
			}
			.card[data-prompt]:hover {
				background: var(--hover);
			}
			.card[data-prompt]:focus-visible,
			.back:focus-visible {
				outline: 2px solid var(--focus);
				outline-offset: 2px;
			}
			.title {
				display: block;
				font-size: 15px;
				font-weight: 650;
				line-height: 1.35;
			}
			.desc {
				display: block;
				margin: 0;
				color: var(--muted);
				font-size: 13px;
				line-height: 1.45;
			}
			.badges {
				display: flex;
				flex-wrap: wrap;
				gap: 6px;
			}
			.badge {
				font-size: 12px;
				line-height: 1.2;
				padding: 4px 8px;
				border-radius: 999px;
				background: var(--pending-bg);
				color: var(--pending-fg);
			}
			.status-pending,
			.priority-low {
				background: var(--pending-bg);
				color: var(--pending-fg);
			}
			.status-progress {
				background: var(--progress-bg);
				color: var(--progress-fg);
			}
			.status-done {
				background: var(--done-bg);
				color: var(--done-fg);
			}
			.status-cancelled {
				background: var(--cancelled-bg);
				color: var(--cancelled-fg);
			}
			.priority-high,
			.priority-critical {
				background: var(--high-bg);
				color: var(--high-fg);
			}
			.priority-medium {
				background: var(--medium-bg);
				color: var(--medium-fg);
			}
			.detail {
				max-width: 40rem;
			}
			.back {
				min-height: 44px;
				margin-top: 4px;
				padding: 8px 2px;
				font: inherit;
				font-weight: 600;
				cursor: pointer;
				border: 0;
				background: transparent;
				color: var(--accent);
			}
			.empty {
				border: 1px dashed var(--line);
				border-radius: 10px;
				padding: 20px 16px;
			}
			.sr {
				position: absolute;
				width: 1px;
				height: 1px;
				padding: 0;
				margin: -1px;
				overflow: hidden;
				clip: rect(0, 0, 0, 0);
				white-space: nowrap;
				border: 0;
			}
		</style>
	</head>
	<body>
		<div id="root"></div>
		<div id="live" class="sr" aria-live="polite"></div>
		<script type="module" src="/mcp-task-view.js"></script>
	</body>
</html>
