id: observability-and-env
title: Observability and Environment Setup
summary: >-
  Companion to tanstack-promptable-fullstack-app-template. Use when adding
  structured logging, centralized environment validation (runtime schemas),
  error-tracking bootstrap, or fixing env/shellSession leaks in a TanStack Start app. Teaches
  interface-first observability patterns: parse env once, inject via middleware,
  project a browser-safe shellSession, and keep process.env out of handlers.
  The reference app uses pino + Sentry behind ObservabilityService — swap vendors
  without changing middleware or handler contracts.
