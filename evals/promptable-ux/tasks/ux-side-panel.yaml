id: ux-side-panel
name: Promptable UI side panel
description: Covers USE FOR side panel chat.
tags: [ux, trigger]
inputs:
  prompt: >-
    Add a promptable UI side panel chat drawer that stays hidden by default
    but is always accessible from the header.
expected:
  outcomes:
    - type: task_completed
graders:
  - name: has_output
    type: code
    config:
      assertions:
        - "len(output) > 10"
